name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app
      - name: Start ephemeral Redis
        run: >-
          docker run -d --name strikers-test-redis
          -p 127.0.0.1:6379:6379
          --tmpfs /data:size=16m
          redis:7.4-alpine
          redis-server --save '' --appendonly no
      - name: Test with fakeredis and real Redis
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          timeout 15s bash -c 'until docker exec strikers-test-redis redis-cli ping >/dev/null 2>&1; do sleep 1; done'
          pytest
      - name: Remove test Redis
        if: always()
        run: docker rm -f -v strikers-test-redis || true
